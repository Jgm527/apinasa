# Nombre de la aplicación (aparece en los logs de arranque)
spring.application.name=ejemplo-mvc

# Puerto del servidor. ${PORT:8080} = usa la variable de entorno PORT si existe,
# y si no, 8080. Prueba: http://localhost:8080
server.port=${PORT:8080}

# Clave de la API de NASA, leída desde una variable de entorno.
# Si no la defines, se usa DEMO_KEY (cuota muy limitada: 30 peticiones/hora por IP).
# En PowerShell: $env:NASA_API_KEY = "tu_clave_personal"   (solo esa sesión)
nasa.api-key=${NASA_API_KEY:DEMO_KEY}
